<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WebGL implementation of DCT (Discrete Cosine Transform) with real-time controls. Compress, glitch, and manipulate images and video using JPEG-like algorithms." />
  <meta name="theme-color" content="#000000" />
  <meta name="og:title" content="DCTLive" />
  <meta name="og:description" content="WebGL DCT compression with real-time controls. Compress, glitch, and manipulate images and video." />
  <meta name="og:type" content="website" />
  <meta name="og:url" content="https://dctlive.geikha.xyz" />
  <meta name="og:image" content="https://dctlive.geikha.xyz/DCT-DEMO-IMG.jpg" />
  <meta name="og:image:width" content="1200" />
  <meta name="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="DCTLive" />
  <meta name="twitter:description" content="WebGL DCT compression with real-time controls." />
  <meta name="twitter:image" content="https://dctlive.geikha.xyz/DCT-DEMO-IMG.jpg" />
  <title>DCTLive</title>
  <link rel="icon" type="image/x-icon" href="./dctlive.ico" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:     #000000;
      --bg-2:   #111111;
      --bg-3:   #1a1a1a;
      --fg:     #e8e8e8;
      --fg-dim: #888888;
      --fg-2:   #555555;
      --accent: #c3ff20;
      --border: #2a2a2a;
      --error:  #f2777a;
      --ok:     #99cc99;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-feature-settings: "liga" 0;
      overflow: hidden;
    }

    #layout {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
    }

    #canvas-area {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }

    #canvas-area canvas { display: block; }

    #panel {
      width: 320px;
      min-width: 320px;
      height: 100vh;
      overflow-y: auto;
      background: var(--bg-2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 680px) {
      html, body { overflow: auto; height: auto; }

      #layout {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }

      #canvas-area { flex: none; }

      #panel {
        width: 100%;
        min-width: 0;
        height: auto;
        overflow-y: visible;
        border-left: none;
        border-top: 1px solid var(--border);
      }

      /* Mobile: larger text and buttons */
      .section-label {
        font-size: 11px;
        margin-bottom: 10px;
        margin-top: 0;
      }

      button {
        font-size: 14px;
        padding: 6px 12px;
        min-height: 40px;
      }

      #source-input {
        font-size: 14px;
        padding: 5px 6px;
        min-height: 40px;
      }

      #canvas-area {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        width: 100%;
        height: auto;
      }

      #panel {
        margin-top: var(--canvas-display-height, 320px);
      }

      .section {
        padding: 12px;
        margin-bottom: 0;
      }

      .section-label {
        margin-bottom: 14px;
      }

      .ctrl-row {
        gap: 8px;
        margin-bottom: 14px;
      }

      .ctrl-row:has(input[type="range"]) {
        margin-bottom: 28px;
      }

      .ctrl-row:has(input[type="range"]):last-child {
        margin-bottom: 28px;
      }

      .ctrl-row:last-child {
        margin-bottom: 0;
      }

      .ctrl-row .val {
        font-size: 13px;
      }

      .row {
        gap: 8px;
        margin-bottom: 14px;
      }

      .row:last-child {
        margin-bottom: 0;
      }

      .dual-row {
        gap: 12px;
        margin-bottom: 14px;
      }

      .dual-row:last-child {
        margin-bottom: 0;
      }

      .check-row {
        gap: 10px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }

      .check-row:last-child {
        margin-bottom: 0;
      }

      .ctrl-row.first-slider {
        margin-top: 28px;
      }

      .check-row label {
        font-size: 14px;
        padding: 6px 12px;
        min-height: 40px;
        flex: 1;
      }

      select {
        font-size: 14px;
        padding: 6px 8px;
        min-height: 40px;
        flex: 1;
      }

      input[type="number"] {
        font-size: 14px;
        padding: 6px 8px;
        min-height: 40px;
        width: 70px;
      }

      #wave-input {
        font-size: 13px;
        padding: 8px 10px;
        min-height: 70px;
        margin-bottom: 14px;
      }
    }

    /* ---- panel header ---- */
    #panel-head {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    #panel-head > div:first-child {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    #panel-head .title { font-size: 13px; letter-spacing: 0.5px; }

    #precision-warning {
      display: none;
      background: rgba(242, 119, 122, 0.15);
      border: 1px solid var(--error);
      padding: 6px 8px;
      font-size: 10px;
      color: var(--error);
      line-height: 1.4;
      margin-bottom: 6px;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    #precision-warning.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    #precision-warning.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #panel-head .title em { font-style: normal; color: var(--accent); }

    #panel-head a {
      font-size: 10px;
      color: var(--fg-2);
      text-decoration: none;
      letter-spacing: 0.5px;
    }
    #panel-head a:hover { color: var(--accent); }

    #status {
      font-size: 10px;
      color: var(--fg-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---- sections ---- */
    .section {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .section-label {
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    /* ---- buttons ---- */
    button {
      font-family: inherit;
      font-size: 12px;
      background: var(--bg-2);
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 3px 8px;
      cursor: pointer;
      outline: none;
      letter-spacing: 0.3px;
    }

    button:hover  { border-color: var(--fg-dim); }
    button:active { background: var(--bg-3); }
    button:focus  { outline: 1px solid var(--accent); outline-offset: -1px; }
    button.active { color: var(--accent); border-color: var(--accent); background: var(--bg-3); }

    /* ---- rows ---- */
    .row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 5px;
    }
    .row:last-child { margin-bottom: 0; }
    .row button { flex: 1; }

    /* ---- source input ---- */
    #source-input {
      font-family: inherit;
      font-size: 12px;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 2px 5px;
      width: 100%;
      outline: none;
    }
    #source-input:focus { outline: 1px solid var(--accent); outline-offset: -1px; }

    /* ---- ctrl rows ---- */
    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }
    .ctrl-row:last-child { margin-bottom: 0; }

    .ctrl-row > .lbl {
      width: 50px;
      min-width: 50px;
      color: var(--fg-dim);
      font-size: 11px;
    }

    .ctrl-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .ctrl-row .val {
      width: 36px;
      text-align: right;
      color: var(--accent);
      font-size: 11px;
    }

    /* ---- dual sliders (side-by-side) ---- */
    .dual-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 5px;
    }
    .dual-row:last-child { margin-bottom: 0; }

    .dual-row .ctrl-row {
      margin-bottom: 0;
    }

    .dual-row .ctrl-row > .lbl {
      width: 28px;
      min-width: 28px;
    }

    .dual-row .ctrl-row input[type="range"] {
      flex: 1;
    }

    .dual-row .ctrl-row .val {
      width: 32px;
      font-size: 10px;
    }

    /* ---- checkbox row ---- */
    .check-row {
      display: flex;
      gap: 16px;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }
    .check-row:last-child { margin-bottom: 0; }

    .check-row label {
      font-family: inherit;
      font-size: 11px;
      background: var(--bg-2);
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 3px 8px;
      cursor: pointer;
      outline: none;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      user-select: none;
    }

    .check-row label:hover {
      border-color: var(--fg-dim);
    }

    .check-row label:active {
      background: var(--bg-3);
    }

    input[type="checkbox"] {
      display: none;
    }

    .check-row label:has(input[type="checkbox"]:checked) {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--bg-3);
    }

    /* ---- select ---- */
    select {
      font-family: inherit;
      font-size: 11px;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 2px 4px;
      outline: none;
      cursor: pointer;
    }
    select:focus { outline: 1px solid var(--accent); outline-offset: -1px; }

    /* ---- number inputs ---- */
    input[type="number"] {
      font-family: inherit;
      font-size: 11px;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 2px 4px;
      width: 60px;
      outline: none;
    }
    input[type="number"]:focus { outline: 1px solid var(--accent); outline-offset: -1px; }

    /* ---- wave function ---- */
    #wave-input {
      font-family: inherit;
      font-size: 11px;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 4px 6px;
      width: 100%;
      resize: vertical;
      min-height: 48px;
      outline: none;
      margin-bottom: 5px;
    }
    #wave-input:focus { outline: 1px solid var(--accent); outline-offset: -1px; }

    /* ---- repo link ---- */
    .section.footer {
      margin-top: auto;
      text-align: center;
      font-size: 11px;
    }
    .section.footer a {
      color: var(--fg-dim);
      text-decoration: none;
    }
    .section.footer a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
<div id="layout">
  <div id="canvas-area"></div>

  <div id="panel">
    <div id="panel-head">
      <div>
        <span class="title">dct<em>live</em></span>
        <a href="https://geikha.xyz" target="_blank" rel="noopener">by geikha</a>
      </div>
      <div id="precision-warning"></div>
      <span id="status">ready</span>
    </div>

    <!-- SOURCE -->
    <div class="section">
      <div class="section-label">source</div>
      <div class="row">
        <input id="source-input" type="text" placeholder="url or index" />
      </div>
      <div class="row">
        <button id="btn-image">load image</button>
        <button id="btn-video">load video</button>
      </div>
      <div class="row">
        <button id="btn-camera">camera</button>
      </div>
      <input type="file" id="file-input" accept="image/*,video/*" style="display:none" />
    </div>

    <!-- RENDER -->
    <div class="section">
      <div class="section-label">render</div>
      <div class="row">
        <div class="ctrl-row" style="flex: 1;">
          <span class="lbl">w</span>
          <input type="number" id="ctrl-width" value="512" min="1" style="flex: 1; min-width: 0;" />
        </div>
        <div class="ctrl-row" style="flex: 1;">
          <span class="lbl">h</span>
          <input type="number" id="ctrl-height" value="512" min="1" style="flex: 1; min-width: 0;" />
        </div>
      </div>
      <div class="row">
        <button id="btn-input-aspect">input aspect</button>
        <button id="btn-input-size">input size</button>
      </div>
      <div class="ctrl-row first-slider">
        <span class="lbl">fps</span>
        <input type="range" id="ctrl-fps" min="0" max="60" step="1" value="0" />
        <span class="val" id="val-fps">∞</span>
      </div>
    </div>

    <!-- DCT/RDCT PASSES -->
    <div class="section">
      <div class="section-label">dct passes</div>
      <div class="check-row">
        <label><input type="checkbox" id="ctrl-dctH" checked /> forward h</label>
        <label><input type="checkbox" id="ctrl-dctV" checked /> forward v</label>
      </div>
      <div class="check-row">
        <label><input type="checkbox" id="ctrl-rdctH" checked /> inverse h</label>
        <label><input type="checkbox" id="ctrl-rdctV" checked /> inverse v</label>
      </div>
      <div class="check-row">
        <label><input type="checkbox" id="ctrl-flipY" checked /> flip y</label>
      </div>
    </div>

    <!-- TRANSFORMS -->
    <div class="section">
      <div class="section-label">transforms</div>
      <div class="ctrl-row first-slider">
        <span class="lbl">block</span>
        <input type="range" id="ctrl-blockSize" min="2" max="64" step="1" value="8" />
        <span class="val" id="val-blockSize">8</span>
      </div>
      <div class="ctrl-row">
        <span class="lbl">lpf</span>
        <input type="range" id="ctrl-lpf" min="1" max="128" step="1" value="128" />
        <span class="val" id="val-lpf">128</span>
      </div>
      <div class="ctrl-row">
        <span class="lbl">hfreq</span>
        <input type="range" id="ctrl-hfreq" min="-2" max="4" step="0.01" value="0" />
        <span class="val" id="val-hfreq">0.00</span>
      </div>
    </div>

    <!-- QUANTIZATION -->
    <div class="section">
      <div class="section-label">quantization</div>
      <div class="check-row">
        <label><input type="checkbox" id="ctrl-yOnly" /> y only</label>
      </div>
      <div class="ctrl-row first-slider">
        <span class="lbl">qY</span>
        <input type="range" id="ctrl-qY" min="0" max="1" step="0.01" value="0" />
        <span class="val" id="val-qY">0.00</span>
      </div>
      <div class="ctrl-row">
        <span class="lbl">qYf</span>
        <input type="range" id="ctrl-qYf" min="0" max="1" step="0.01" value="0" />
        <span class="val" id="val-qYf">0.00</span>
      </div>
      <div class="ctrl-row">
        <span class="lbl">qC</span>
        <input type="range" id="ctrl-qC" min="0" max="1" step="0.01" value="0" />
        <span class="val" id="val-qC">0.00</span>
      </div>
      <div class="ctrl-row">
        <span class="lbl">qCf</span>
        <input type="range" id="ctrl-qCf" min="0" max="1" step="0.01" value="0" />
        <span class="val" id="val-qCf">0.00</span>
      </div>
      <div class="ctrl-row">
        <span class="lbl">qA</span>
        <input type="range" id="ctrl-qA" min="0" max="1" step="0.01" value="0" />
        <span class="val" id="val-qA">0.00</span>
      </div>
      <div class="ctrl-row">
        <span class="lbl">qAf</span>
        <input type="range" id="ctrl-qAf" min="0" max="1" step="0.01" value="0" />
        <span class="val" id="val-qAf">0.00</span>
      </div>
    </div>

    <!-- INPUT SETTINGS -->
    <div class="section">
      <div class="section-label">input</div>
      <div class="ctrl-row">
        <span class="lbl">fit</span>
        <select id="ctrl-fit">
          <option value="fit">fit</option>
          <option value="fill">fill</option>
          <option value="stretch" selected>stretch</option>
        </select>
      </div>
      <div class="ctrl-row">
        <span class="lbl">filter</span>
        <select id="ctrl-filter">
          <option value="linear" selected>linear</option>
          <option value="nearest">nearest</option>
        </select>
      </div>
      <div class="ctrl-row">
        <span class="lbl">wrap</span>
        <select id="ctrl-wrap">
          <option value="mask" selected>mask</option>
          <option value="clamp">clamp</option>
          <option value="repeat">repeat</option>
          <option value="mirror">mirror</option>
        </select>
      </div>
    </div>

    <!-- WAVE FUNCTION -->
    <div class="section">
      <div class="section-label">idct wave function</div>
      <textarea id="wave-input" rows="2" spellcheck="false">return cos(angle);</textarea>
      <div class="row">
        <button id="btn-wave-apply">apply</button>
        <button id="btn-wave-reset">reset</button>
      </div>
    </div>

    <!-- REPO -->
    <div class="section footer">
      <a href="https://github.com/geikha/dctlive" target="_blank" rel="noopener">github.com/geikha/dctlive</a>
    </div>
  </div>
</div>

<script>
  function initDemo() {
    const PANEL_W = 320;
    const MOBILE_BP = 680;

    function isMobile() { return window.innerWidth <= MOBILE_BP; }

    function calcDisplaySize(renderW, renderH) {
      const ar = renderW / renderH;
      if (isMobile()) {
        const w = window.innerWidth;
        return { w, h: Math.round(w / ar) };
      }
      const availW = window.innerWidth - PANEL_W;
      const availH = window.innerHeight;
      let w = availW, h = Math.round(w / ar);
      if (h > availH) { h = availH; w = Math.round(h * ar); }
      return { w, h };
    }

    const RENDER_W = 512, RENDER_H = 512;
    const { w: initW, h: initH } = calcDisplaySize(RENDER_W, RENDER_H);

    const precision = new URLSearchParams(window.location.search).get('precision') || '16bit';
    const dct = new DCTLive({ width: RENDER_W, height: RENDER_H, loop: true, precision });
    document.getElementById('canvas-area').appendChild(dct.canvas);
    dct.resizeCanvas(initW, initH);

    // Update panel margin to account for fixed canvas height on mobile
    if (isMobile()) {
      document.documentElement.style.setProperty('--canvas-display-height', initH + 'px');
    }

    // Show warning if 8-bit precision is detected
    const warningEl = document.getElementById('precision-warning');
    if (dct.precision === '8bit') {
      warningEl.textContent = 'Mobile devices default to 8bit precision, which can cause noisy results';
      warningEl.classList.add('show');

      // Auto-dismiss after 5 seconds
      const warningTimeout = setTimeout(() => {
        warningEl.classList.add('fade-out');
        setTimeout(() => warningEl.classList.remove('show', 'fade-out'), 300);
      }, 5000);

      // Dismiss on click
      warningEl.addEventListener('click', () => {
        clearTimeout(warningTimeout);
        warningEl.classList.add('fade-out');
        setTimeout(() => warningEl.classList.remove('show', 'fade-out'), 300);
      });
    }

    function refreshCanvasSize() {
      const { w, h } = calcDisplaySize(dct.width, dct.height);
      dct.resizeCanvas(w, h);
      if (isMobile()) {
        document.documentElement.style.setProperty('--canvas-display-height', (h + 8) + 'px');
      }
    }

    window.addEventListener('resize', refreshCanvasSize);

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    // ---- Source ----

    document.getElementById('btn-image').addEventListener('click', () => {
      const input = document.getElementById('source-input').value.trim();
      if (!input) {
        document.getElementById('file-input').click();
        return;
      }
      setStatus('loading...');
      dct.initImage(input).catch((e) => {
        setStatus('error: ' + (e.message || 'failed'));
      });
    });

    document.getElementById('btn-video').addEventListener('click', () => {
      const input = document.getElementById('source-input').value.trim();
      if (!input) {
        document.getElementById('file-input').click();
        return;
      }
      setStatus('loading...');
      dct.initVideo(input).catch((e) => {
        setStatus('error: ' + (e.message || 'failed'));
      });
    });

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      setStatus('loading...');
      const url = URL.createObjectURL(file);
      if (file.type && file.type.startsWith('video/')) {
        dct.initVideo(url).then(() => setStatus(file.name));
      } else {
        dct.initImage(url).then(() => setStatus(file.name));
      }
    });

    document.getElementById('btn-camera').addEventListener('click', async () => {
      const input = document.getElementById('source-input').value.trim();
      const selector = /^\d+$/.test(input) ? parseInt(input, 10) : input || 0;
      setStatus('opening camera...');
      try {
        await dct.initCam(selector);
        setStatus('camera ' + (input || '0'));
      } catch (e) {
        setStatus('error: ' + (e.message || 'failed'));
      }
    });

    // ---- Rendering ----

    function applyResolution() {
      const w = parseInt(document.getElementById('ctrl-width').value, 10);
      const h = parseInt(document.getElementById('ctrl-height').value, 10);
      if (w > 0 && h > 0) {
        dct.setResolution(w, h);
        refreshCanvasSize();
      }
    }

    document.getElementById('ctrl-width').addEventListener('change', applyResolution);
    document.getElementById('ctrl-height').addEventListener('change', applyResolution);

    // ---- Input aspect/size buttons ----

    document.getElementById('btn-input-aspect').addEventListener('click', () => {
      if (!dct.input.texture) {
        setStatus('no input loaded');
        return;
      }
      const inputW = dct.input.sourceWidth;
      const inputH = dct.input.sourceHeight;
      if (!inputW || !inputH) {
        setStatus('no input source');
        return;
      }
      // Maintain current height, adapt width to input aspect ratio
      const aspect = inputW / inputH;
      const currentH = parseInt(document.getElementById('ctrl-height').value, 10);
      const newW = Math.round(currentH * aspect);

      document.getElementById('ctrl-width').value = newW;
      document.getElementById('ctrl-height').value = currentH;
      applyResolution();
    });

    document.getElementById('btn-input-size').addEventListener('click', () => {
      if (!dct.input.texture) {
        setStatus('no input loaded');
        return;
      }
      const inputW = dct.input.sourceWidth;
      const inputH = dct.input.sourceHeight;
      if (!inputW || !inputH) {
        setStatus('no input source');
        return;
      }

      document.getElementById('ctrl-width').value = inputW;
      document.getElementById('ctrl-height').value = inputH;
      applyResolution();
    });

    document.getElementById('ctrl-fps').addEventListener('input', (e) => {
      const fps = parseInt(e.target.value, 10);
      dct.fps = fps;
      document.getElementById('val-fps').textContent = fps === 0 ? '∞' : fps;
    });

    // ---- DCT passes ----

    function updateDCTPasses() {
      const dctH = document.getElementById('ctrl-dctH').checked;
      const dctV = document.getElementById('ctrl-dctV').checked;
      const rdctH = document.getElementById('ctrl-rdctH').checked;
      const rdctV = document.getElementById('ctrl-rdctV').checked;
      dct.setDCT(dctH, dctV);
      dct.setIDCT(rdctH, rdctV);
      if (!dct._looping) dct.run();
    }

    ['ctrl-dctH', 'ctrl-dctV', 'ctrl-rdctH', 'ctrl-rdctV'].forEach((id) => {
      document.getElementById(id).addEventListener('change', updateDCTPasses);
    });

    // ---- FlipY toggle ----

    document.getElementById('ctrl-flipY').addEventListener('change', (e) => {
      dct.flipY = e.target.checked;
      if (!dct._looping) dct.run();
    });

    // ---- Y-only mode ----

    document.getElementById('ctrl-yOnly').addEventListener('change', (e) => {
      dct.yOnly = e.target.checked;
      if (!dct._looping) dct.run();
    });

    // ---- Transforms ----

    const TRANSFORM_CTRLS = [
      { id: 'ctrl-blockSize', uniform: 'blockSize', val: 'val-blockSize', isInt: true },
      { id: 'ctrl-lpf', uniform: 'lpf', val: 'val-lpf', isInt: true },
      { id: 'ctrl-hfreq', uniform: 'highFreqMultiplier', val: 'val-hfreq', isInt: false },
    ];

    TRANSFORM_CTRLS.forEach(({ id, uniform, val, isInt }) => {
      const slider = document.getElementById(id);
      slider.addEventListener('input', (e) => {
        const v = isInt ? parseInt(e.target.value) : parseFloat(e.target.value);
        dct.setUniform(uniform, v);
        document.getElementById(val).textContent = isInt ? v : v.toFixed(2);
        if (!dct._looping) dct.run();
      });
    });

    // ---- Mousewheel fine adjustments ----

    function attachWheelListener(sliderId) {
      const slider = document.getElementById(sliderId);
      if (!slider) return;
      slider.addEventListener('wheel', (e) => {
        e.preventDefault();
        const step = parseFloat(slider.step) || 1;
        const direction = e.deltaY > 0 ? -1 : 1;
        let newVal = parseFloat(slider.value) + (step * direction);
        newVal = Math.max(parseFloat(slider.min), Math.min(parseFloat(slider.max), newVal));
        slider.value = newVal;
        slider.dispatchEvent(new Event('input', { bubbles: true }));
      }, { passive: false });
    }

    // Attach to all sliders
    document.querySelectorAll('input[type="range"]').forEach((slider) => {
      if (slider.id) attachWheelListener(slider.id);
    });

    // ---- Quantization (including frequency-dependent) ----

    const QUANT_CTRLS = [
      { id: 'ctrl-qY', uniform: 'quantizeY', val: 'val-qY' },
      { id: 'ctrl-qYf', uniform: 'quantizeYf', val: 'val-qYf' },
      { id: 'ctrl-qC', uniform: 'quantizeC', val: 'val-qC' },
      { id: 'ctrl-qCf', uniform: 'quantizeCf', val: 'val-qCf' },
      { id: 'ctrl-qA', uniform: 'quantizeA', val: 'val-qA' },
      { id: 'ctrl-qAf', uniform: 'quantizeAf', val: 'val-qAf' },
    ];

    QUANT_CTRLS.forEach(({ id, uniform, val }) => {
      document.getElementById(id).addEventListener('input', (e) => {
        const v = parseFloat(e.target.value);
        dct.setUniform(uniform, v);
        document.getElementById(val).textContent = v.toFixed(2);
        if (!dct._looping) dct.run();
      });
    });

    // ---- Input settings ----

    document.getElementById('ctrl-fit').addEventListener('change', (e) => {
      dct.input.fit = e.target.value;
      if (!dct._looping) dct.run();
    });

    document.getElementById('ctrl-filter').addEventListener('change', (e) => {
      dct.input.magFilter = e.target.value;
      dct.input.minFilter = e.target.value;
      if (!dct._looping) dct.run();
    });

    document.getElementById('ctrl-wrap').addEventListener('change', (e) => {
      dct.input.wrap = e.target.value;
      if (!dct._looping) dct.run();
    });

    // ---- Wave function ----

    const DEFAULT_WAVE = 'return cos(angle);';

    document.getElementById('btn-wave-apply').addEventListener('click', () => {
      const body = document.getElementById('wave-input').value.trim();
      try {
        dct.setWaveFunction(body);
        if (!dct._looping) dct.run();
      } catch (e) {
        setStatus('wave error: ' + (e.message || 'invalid glsl'));
      }
    });

    document.getElementById('btn-wave-reset').addEventListener('click', () => {
      dct.resetWaveFunction();
      document.getElementById('wave-input').value = DEFAULT_WAVE;
      if (!dct._looping) dct.run();
    });

    // ---- Drag and drop ----

    const canvasArea = document.getElementById('canvas-area');

    canvasArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
      canvasArea.style.backgroundColor = 'rgba(195, 255, 32, 0.1)';
    });

    canvasArea.addEventListener('dragleave', (e) => {
      e.preventDefault();
      e.stopPropagation();
      canvasArea.style.backgroundColor = '';
    });

    canvasArea.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      canvasArea.style.backgroundColor = '';

      const files = e.dataTransfer.files;
      if (!files || files.length === 0) return;

      const file = files[0];
      setStatus('loading...');
      const url = URL.createObjectURL(file);
      const isVideo = file.type && file.type.startsWith('video/');

      if (isVideo) {
        dct.initVideo(url).then(() => setStatus(file.name)).catch((err) => {
          setStatus('error: ' + (err.message || 'failed'));
        });
      } else {
        dct.initImage(url).then(() => setStatus(file.name)).catch((err) => {
          setStatus('error: ' + (err.message || 'failed'));
        });
      }
    });
  }

  // Load library and call initDemo when ready
  const libScript = document.createElement('script');
  libScript.src = '../dist/dctlive.js';
  libScript.onload = initDemo;
  libScript.onerror = () => {
    // Fallback to CDN if local build not available
    const cdnScript = document.createElement('script');
    cdnScript.src = 'https://unpkg.com/dctlive@latest/dist/dctlive.js';
    cdnScript.onload = initDemo;
    document.head.appendChild(cdnScript);
  };
  document.head.appendChild(libScript);
</script>
</body>
</html>
